[project]
name = "training-llm-bridge"
version = "0.1.1"
description = "Local LLM bridge for Hevy training data and routine updates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
training-bridge = "training_llm_bridge.cli:main"
training-bridge-mcp = "training_llm_bridge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
